      <stop offset="0%" stop-color="#fffaf9" />
      <stop offset="100%" stop-color="#ffe5e1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1010" cy="120" r="120" fill="#ffd7d1" opacity="0.45" />
  <circle cx="150" cy="560" r="180" fill="#ffe4df" opacity="0.5" />

