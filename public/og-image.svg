  <text x="610" y="365" text-anchor="middle" font-size="42" fill="#991b1b" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif">近くの一杯を、地図から探す</text>
